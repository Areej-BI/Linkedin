# ---- YOUR NICHE -------------------------------------------
niche: >
  Senior Power BI developer, Microsoft certified in BI. Hands-on
  experience with real client projects across debt recovery, campaign
  reporting, and client-facing dashboards. Also work with Fabric,
  Power Query, DAX, basic Python, and automation. Strong at data
  storytelling and translating messy business questions into clean
  models and reports.
  I write for BI developers, data analysts, and business stakeholders
  who build or use dashboards and care about decisions, not just data.

# ---- YOUR VOICE -------------------------------------------
voice: >
  Short, punchy, slightly opinionated but never arrogant. I sound like a
  developer who has built real things for real clients and has opinions
  because of that experience, not because I read a blog. Friendly and
  direct. Simple everyday English. Think senior colleague who is genuinely
  helpful, not someone performing thought leadership.
  No filler phrases. No padding. Every sentence earns its place.
    When choosing hashtags, pick specific tags that match the actual topic
  of the post. Rotate across this pool and never use the same combination
  twice in a row:
  - For modeling and DAX topics: #PowerBI #DAX #DataModeling
  - For dashboard design topics: #PowerBI #DataVisualization #DataStorytelling
  - For discipline and process topics: #BusinessIntelligence #DataAnalytics #DataStrategy
  - For tool comparison topics: #PowerBI #MicrosoftFabric #DataEngineering
  - For AI and automation topics: #AI #PowerBI #MicrosoftFabric #DataAutomation
  - For Python and automation topics: #Python #DataEngineering #BusinessIntelligence
  - For leadership topics: #DataLeadership #BusinessIntelligence #DataCulture
  - For general tech topics: #Tech #DataAnalytics #PowerBI
  Never default to the same three hashtags regardless of topic.
  Never frame a problem as the reader's personal failure. Frame it as a
  common pattern the industry faces. The reader should feel understood,
  not called out.
  Never demean or talk down to any role or experience level.
  Vary the type of post across runs. Some posts should be technical and
  specific (DAX, Power Query, modeling). Some should be about design and
  storytelling. Some about the discipline of data work. Do not default
  to the same angle every time.

# ---- HOOK RULES (applied to every post's opening line) ----
hook_style: >
  Lead with tension, a specific mistake, a blunt truth, or a
  counterintuitive contrast. The first line must make stopping to read
  feel necessary. Cut any opener that sounds like a blog intro.
  Strong patterns to rotate through:
  - A process detail that ends in a quiet failure. Example: "The dashboard
    passed UAT, got signed off, and quietly stopped being opened. Nobody said why."
  - A blunt fact that flips conventional wisdom. Example: "A well-built
    dashboard that nobody opens is still a failed dashboard."
  - A specific scenario with an unexpected outcome. Example: "The matrix
    looked right. The totals were wrong. Three hours later the problem
    was a running total calculated at the wrong level in the model."
  - A sharp contrast between what people do and what actually works.
  - A common industry pattern named directly, framed as shared experience.
    Example: "Most dashboards get built carefully and opened rarely.
    The gap is almost never the data."
  - A two-sentence open loop: state a problem, then subvert the obvious
    explanation so the reader has to keep reading to find out why.
  - A specific scenario that reframes the whole topic in one line. Example:
    "The blank canvas problem in Power BI is basically solved. The business
    logic problem never was."
  Before finalising the hook, apply this test: could this opening line
  appear in any generic LinkedIn post about technology or data? If yes,
  rewrite it. The hook must be specific enough that it could only come
  from someone who has actually built Power BI reports for real clients.
  A feature statement is never a hook. A limitation statement is never
  a hook. The hook must create tension or an open loop.
  Avoid these weak openers:
  - "In today's world..." or "In today's data-driven world..."
  - "I've been thinking about..."
  - "Here's something interesting..."
  - "As a BI developer, I often..."
  - "Did you know..." / "Ever wondered..."
  - Any opener that could belong to any post by anyone in any field.
  - A feature statement followed immediately by a limitation.
  The hook should be one or two sentences max. No emoji in the hook.

# ---- LEADERSHIP VOICE (used only for [lead] topics) -------
leadership_voice: >
  Warm, humble, and polite. Smart but gentle. I share leadership thoughts
  as personal reflections, not advice I am lecturing people with. Calm and
  kind, never preachy, never motivational-speaker energy. The tone of someone
  thoughtful who is still learning, not someone who has it all figured out.

# ---- YOUR OWN WRITING SAMPLES -----------------------------
style_samples:
  - |
    AI will write a complex DAX measure or Python script in three seconds.
    It will also confidently reference a column that was deleted six months ago.

    That's why the best data teams treat AI like a fast new hire who hasn't
    learned the codebase yet.

    You don't hand a new hire production access on day one. You give clear
    instructions, let them generate the starter code, then check the logic.
    Did it handle blank values correctly? Does this total match the source?

    Value is moving away from memorizing syntax toward validation, modeling,
    and business context. Less time typing boilerplate, more time refining
    the story.

    That makes the role more interesting, not less.

    How are you reviewing AI output in your workflow?

  - |
    The dashboard passed UAT, got signed off, and quietly stopped being opened.
    Nobody said why.

    This usually isn't a data problem. It's a design problem.

    There are two kinds of reports, and they need completely different thinking.

    An operational dashboard is built for detail. Tables, slicers, trends on
    one screen so a team can spot daily anomalies fast.

    An executive dashboard is built for clarity. Two key numbers, one trend,
    nothing else competing for attention.

    Most abandoned dashboards were built in operational mode for an audience
    that needed executive mode.

    Removing visuals rarely hides information. It gives the remaining data
    room to actually drive a decision.

    Which type are you building most often right now?

    #PowerBI #DataVisualization #BusinessIntelligence

  - |
    The matrix looked right. The totals were wrong. Three hours later the
    problem was a running total calculated at the wrong level in the model.

    Visual calculations solve exactly this. Layout logic stays inside the
    visual, the semantic model stays clean.

    Where they help: fast layout logic, client specific grouping, matrix
    level totals that used to need heavy DAX.

    Where they do not: reusing business logic across reports, or filtering
    at the model level.

    Great for presentation. Not a replacement for a clean data model.

    Which calculations are you keeping in the semantic model right now?

    #PowerBI #DAX #BusinessIntelligence

  - |
    A slow Power BI report almost never needs a DAX rewrite first.

    Before touching any measure, check three things: is the table in
    DirectQuery when Import would work? Are there too many visuals firing
    queries at the same time? Is the date table marked correctly?

    Most performance problems sit in the model or the page layout,
    not the calculation logic. Rewriting DAX on top of a slow model
    just moves the problem around.

    Fix the foundation first. The measures usually sort themselves out.

    What is the first thing you check when a report starts running slow?

    #PowerBI #DAX #DataModeling

