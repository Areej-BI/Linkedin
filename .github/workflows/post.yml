name: LinkedIn Auto Post

on:
  schedule:
    # ─────────────────────────────────────────────────────────────
    #  Times are UTC. Pakistan (PKT) = UTC+5.
    #  day-of-week: 0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
    #  Posts on Wednesday & Friday at 3:30 PM PKT (10:30 UTC).
    # ─────────────────────────────────────────────────────────────
    - cron: "30 10 * * 3"   # Wed 10:30 UTC = 3:30 PM PKT
    - cron: "30 10 * * 5"   # Fri 10:30 UTC = 3:30 PM PKT
    - cron: "37 22 * * 0"   # Sun 22:33 UTC = 3:37 AM Mon PKT
  workflow_dispatch:       # run it by hand from the Actions tab

# Give the workflow permission to write back to the repo
# (needed to save last_topic.txt so we don't repeat topics)
permissions:
  contents: write

jobs:
  # STEP 1 — AI picks a topic and writes the draft (does NOT post)
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Write the draft
        run: python post_to_linkedin.py generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # Save last_topic.txt back to the repo so the next run avoids repeating
      - name: Save last topic
        run: |
          git config user.name "linkedin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_topic.txt last_format.txt last_section.txt
          git diff --cached --quiet || git commit -m "chore: update last topic"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the draft to the publish step
      - uses: actions/upload-artifact@v4
        with:
          name: draft
          path: draft/

  # STEP 2 — publish (pauses and waits for YOUR approval)
  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: production   # <── remove the reviewer later to skip approval
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: draft
          path: draft/

      - name: Publish to LinkedIn
        run: python post_to_linkedin.py publish
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
